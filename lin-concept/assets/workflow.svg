<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650">
<rect width="1400" height="650" rx="28" fill="#0f172a"/>
<g font-family="PingFang SC,Microsoft YaHei,sans-serif">
<text x="60" y="78" font-size="38" font-weight="700" fill="#f8fafc">林氏理解法 · 从最小例子到完整机制</text>
<text x="60" y="122" font-size="22" fill="#94a3b8">同一个样本贯穿五步｜用图解释变化｜用迁移题检查理解</text>
<rect x="60" y="170" width="240" height="155" rx="16" fill="#1e293b" stroke="#334155"/>
<text x="80" y="207" font-size="20" fill="#38bdf8">01</text>
<text x="80" y="250" font-size="27" font-weight="600" fill="#f8fafc">最小例子</text>
<text x="80" y="294" font-size="17" fill="#cbd5e1">输入 → 规则 → 结果</text>
<text x="303" y="257" font-size="24" fill="#38bdf8">→</text>
<rect x="320" y="170" width="240" height="155" rx="16" fill="#1e293b" stroke="#334155"/>
<text x="340" y="207" font-size="20" fill="#38bdf8">02</text>
<text x="340" y="250" font-size="27" font-weight="600" fill="#f8fafc">同类定位</text>
<text x="340" y="294" font-size="17" fill="#cbd5e1">类别 · 区别 · 条件</text>
<text x="563" y="257" font-size="24" fill="#38bdf8">→</text>
<rect x="580" y="170" width="240" height="155" rx="16" fill="#1e293b" stroke="#334155"/>
<text x="600" y="207" font-size="20" fill="#38bdf8">03</text>
<text x="600" y="250" font-size="27" font-weight="600" fill="#f8fafc">熟悉类比</text>
<text x="600" y="294" font-size="17" fill="#cbd5e1">对应关系 + 失效点</text>
<text x="823" y="257" font-size="24" fill="#38bdf8">→</text>
<rect x="840" y="170" width="240" height="155" rx="16" fill="#1e293b" stroke="#334155"/>
<text x="860" y="207" font-size="20" fill="#38bdf8">04</text>
<text x="860" y="250" font-size="27" font-weight="600" fill="#f8fafc">完整机制</text>
<text x="860" y="294" font-size="17" fill="#cbd5e1">谁处理什么，如何变化</text>
<text x="1083" y="257" font-size="24" fill="#38bdf8">→</text>
<rect x="1100" y="170" width="240" height="155" rx="16" fill="#1e293b" stroke="#334155"/>
<text x="1120" y="207" font-size="20" fill="#38bdf8">05</text>
<text x="1120" y="250" font-size="27" font-weight="600" fill="#f8fafc">细节补充</text>
<text x="1120" y="294" font-size="17" fill="#cbd5e1">边界 · 误区 · 迁移题</text>
<text x="60" y="385" font-size="24" fill="#f8fafc">机制可视化示例：梯度下降的两次更新（教学设定）</text>
<text x="60" y="425" font-size="21" fill="#94a3b8">L(x)=x²，学习率 η=0.25；每次更新 x ← x − η·2x</text>
<rect x="60" y="470" width="270" height="75" rx="14" fill="#164e63"/>
<text x="195" y="518" text-anchor="middle" font-size="27" fill="#ecfeff">x=4 · L=16</text>
<rect x="560" y="470" width="270" height="75" rx="14" fill="#164e63"/>
<text x="695" y="518" text-anchor="middle" font-size="27" fill="#ecfeff">x=2 · L=4</text>
<rect x="1060" y="470" width="270" height="75" rx="14" fill="#164e63"/>
<text x="1195" y="518" text-anchor="middle" font-size="27" fill="#ecfeff">x=1 · L=1</text>
<text x="440" y="488" text-anchor="middle" font-size="19" fill="#cbd5e1">梯度8，减去2</text>
<path d="M350 520 h180 l-12 -7 m12 7 l-12 7" fill="none" stroke="#38bdf8" stroke-width="3"/>
<text x="940" y="488" text-anchor="middle" font-size="19" fill="#cbd5e1">梯度4，减去1</text>
<path d="M850 520 h180 l-12 -7 m12 7 l-12 7" fill="none" stroke="#38bdf8" stroke-width="3"/>
<text x="60" y="605" font-size="20" fill="#94a3b8">图解释规则与状态变化，不替代正文推演；简单追问不强制出图。</text>
</g></svg>
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>流程一 · 批注逐块审核</title>
  <style>
    :root{color-scheme:dark;--bg:#080a0d;--panel:#12161b;--line:#2a313b;--text:#f5f7fa;--muted:#909aa7;--cyan:#54d8dc;--green:#46d797;--orange:#ffad58;--red:#ff6f78}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 18% -8%,#173237 0,transparent 33%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-rows:auto 1fr}header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:13px 20px;background:#080a0ded;border-bottom:1px solid var(--line);backdrop-filter:blur(16px)}h1{font-size:16px;margin:0}.subtitle{margin-top:4px;font-size:12px;color:var(--muted)}kbd{padding:1px 6px;border:1px solid #47515f;border-bottom-width:2px;border-radius:5px;background:#222832;color:#fff}.progress-wrap{min-width:240px;text-align:right}.progress-text{font-size:12px;color:#c8d0da}.progress{height:5px;margin-top:6px;border-radius:999px;background:#252c35;overflow:hidden}.progress>span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--green));transition:width .2s}.layout{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:16px;padding:16px;max-width:1480px;width:100%;margin:auto}.stage,.queue{border:1px solid var(--line);border-radius:15px;background:#11151adf;box-shadow:0 24px 70px #0007}.stage{padding:16px;min-width:0}.block-head{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:12px}.eyebrow{color:var(--cyan);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.block-title{font-size:22px;font-weight:850;margin-top:4px}.status{padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800;background:#272e37;color:#b9c2ce}.status.approved{background:#123a2c;color:#79eeb7}.status.changes_requested{background:#431f24;color:#ff9ca3}.video-shell{display:flex;justify-content:center;background:#030405;border-radius:11px;overflow:hidden;min-height:280px}video{display:block;height:min(60vh,650px);max-width:100%;background:#000}.transport{display:flex;align-items:center;gap:8px;margin-top:10px}.transport button,.secondary{border:1px solid #343d48;background:#1b2027;color:#edf1f6;border-radius:8px;padding:7px 10px}.time{font-variant-numeric:tabular-nums;font-weight:750;margin-left:3px}.nav-hint{margin-left:auto;color:var(--muted);font-size:11px}.context{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.context-card{border:1px solid #2c343f;border-radius:10px;background:#171c22;padding:11px}.context-label{font-size:10px;color:var(--muted);font-weight:800;letter-spacing:.06em}.context-body{font-size:14px;line-height:1.55;margin-top:6px;white-space:pre-wrap}.edit-body{color:#c8fcff}.comment-box{margin-top:12px;border:1px solid #36404d;border-radius:11px;background:#161b21;padding:11px}.comment-meta{display:flex;justify-content:space-between;gap:10px;margin-bottom:7px;font-size:11px;color:var(--muted)}textarea{width:100%;min-height:86px;resize:vertical;background:#0c0f13;color:#fff;border:1px solid #384351;border-radius:8px;padding:9px;outline:none}textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #54d8dc1c}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:9px}.approve{border:0;border-radius:8px;padding:9px 14px;background:var(--green);color:#05150e;font-weight:850}.request{border:0;border-radius:8px;padding:9px 14px;background:var(--orange);color:#1b1005;font-weight:850}.queue{padding:13px;max-height:calc(100vh - 86px);overflow:auto}.queue h2{font-size:14px;margin:0 0 10px}.queue-item{width:100%;display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:8px;text-align:left;border:1px solid #2c343e;background:#171b21;color:#e9edf2;border-radius:9px;padding:9px;margin-bottom:6px}.queue-item:hover{border-color:#4c5a68}.queue-item.active{border-color:var(--cyan);box-shadow:0 0 0 2px #54d8dc1a}.num{display:grid;place-items:center;width:25px;height:25px;border-radius:50%;background:#252c34;font-size:11px;font-weight:850}.queue-copy{min-width:0}.queue-title{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.queue-time{font-size:10px;color:var(--muted);margin-top:3px}.dot{width:8px;height:8px;border-radius:50%;background:#687381}.dot.approved{background:var(--green)}.dot.changes_requested{background:var(--red)}.complete{display:none;margin-top:12px;border:1px solid #287452;background:#103427;border-radius:11px;padding:12px;color:#9af1c3;font-size:13px;line-height:1.5}.complete.show{display:block}.save{font-size:11px;color:var(--green)}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,18px);opacity:0;transition:.2s;background:#eef8f7;color:#071313;border-radius:999px;padding:8px 13px;font-size:12px;font-weight:800;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:900px){header{align-items:flex-start}.progress-wrap{min-width:140px}.layout{grid-template-columns:1fr;padding:9px}.queue{max-height:none}.context{grid-template-columns:1fr}video{height:min(54vh,580px)}.nav-hint{display:none}}
  </style>
</head>
<body>
<div class="app">
  <header><div><h1>流程一 · 批注逐块审核</h1><div class="subtitle"><kbd>←</kbd> 上一个　<kbd>→</kbd> 通过并下一个　<kbd>M</kbd> 定点评论　<kbd>Space</kbd> 播放/暂停</div></div><div class="progress-wrap"><div class="progress-text" id="progressText">加载中…</div><div class="progress"><span id="progressBar"></span></div></div></header>
  <main class="layout">
    <section class="stage">
      <div class="block-head"><div><div class="eyebrow" id="eyebrow">ANNOTATION REVIEW</div><div class="block-title" id="blockTitle">加载中…</div></div><span class="status" id="status">待审核</span></div>
      <div class="video-shell"><video id="video" controls preload="auto"></video></div>
      <div class="transport"><button id="playBtn">▶ 播放</button><button id="restartBtn">↺ 重播本段</button><span class="time"><span id="now">00:00.0</span> / <span id="duration">00:00.0</span></span><span class="nav-hint">这不是拼接视频；每次只审核当前一个板块</span></div>
      <div class="context"><div class="context-card"><div class="context-label">你上一次的批注</div><div class="context-body" id="originalComment"></div></div><div class="context-card"><div class="context-label">这一版怎么改的</div><div class="context-body edit-body" id="editSummary"></div></div></div>
      <div class="comment-box"><div class="comment-meta"><span>仍有问题时按 M 定位，或直接填写修改意见</span><span id="commentTime">未定点</span></div><textarea id="comment" placeholder="例如：片段内 00:04.2 还有气口；这里再短一点。"></textarea><div class="actions"><button class="secondary" id="previousBtn">← 上一个</button><button class="request" id="requestBtn">保存 Comment　Enter</button><button class="approve" id="approveBtn">通过并下一个　→</button></div></div>
      <div class="complete" id="complete">流程一的所有批注板块已经通过。现在才可以进入流程二：生成并审核完整视频。</div>
    </section>
    <aside class="queue"><h2>审核队列 <span class="save" id="saveState">正在加载…</span></h2><div id="queue"></div></aside>
  </main>
</div><div class="toast" id="toast"></div>
<script>
(() => {
  const $=s=>document.querySelector(s),video=$('#video'),comment=$('#comment');
  let state={version:1,video:'',blocks:[]},index=0,commentAnchor=null,saving=false;
  const fmt=t=>{t=Math.max(0,Number(t)||0);const m=Math.floor(t/60),s=t-m*60;return `${String(m).padStart(2,'0')}:${s.toFixed(1).padStart(4,'0')}`};
  const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
  const toast=msg=>{$('#toast').textContent=msg;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),1300)};
  const active=()=>state.blocks[index];
  const statusText=s=>s==='approved'?'已通过':s==='changes_requested'?'需要再改':'待审核';
  async function persist(){saving=true;$('#saveState').textContent='保存中…';try{const r=await fetch('/api/review-blocks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(state)});if(!r.ok)throw new Error((await r.json()).error);const out=await r.json();state.updatedAt=out.updatedAt;$('#saveState').textContent='已自动保存';}catch(e){$('#saveState').textContent='保存失败';toast(`保存失败：${e.message}`)}finally{saving=false}}
  function renderQueue(){
    $('#queue').innerHTML=state.blocks.map((b,i)=>`<button class="queue-item${i===index?' active':''}" data-index="${i}"><span class="num">${i+1}</span><span class="queue-copy"><span class="queue-title">${esc(b.originalComment)}</span><span class="queue-time">原 Preview M ${b.previewTime==null?'—':fmt(b.previewTime)}</span></span><span class="dot ${b.status||'pending'}"></span></button>`).join('');
    const approved=state.blocks.filter(b=>b.status==='approved').length,requested=state.blocks.filter(b=>b.status==='changes_requested').length,total=state.blocks.length;
    $('#progressText').textContent=`已通过 ${approved}/${total}${requested?`　·　待修改 ${requested}`:''}`;$('#progressBar').style.width=`${total?approved/total*100:0}%`;$('#complete').classList.toggle('show',total>0&&approved===total);
  }
  function loadBlock(nextIndex,autoplay=false){
    if(!state.blocks.length)return;index=Math.max(0,Math.min(state.blocks.length-1,nextIndex));const b=active();video.pause();video.src=b.clipUrl;video.load();
    $('#eyebrow').textContent=`ANNOTATION ${index+1} OF ${state.blocks.length}`;$('#blockTitle').textContent=`批注板块 ${index+1}`;$('#originalComment').textContent=b.originalComment||'（无原评论）';$('#editSummary').textContent=b.editSummary||'已按批注修改';
    $('#status').textContent=statusText(b.status);$('#status').className=`status ${b.status||'pending'}`;comment.value=b.reviewerComment||'';commentAnchor=b.reviewerCommentTime??null;$('#commentTime').textContent=commentAnchor==null?'未定点':`片段内 ${fmt(commentAnchor)}`;renderQueue();requestAnimationFrame(()=>document.querySelector('.queue-item.active')?.scrollIntoView({block:'nearest'}));
    if(autoplay)video.addEventListener('canplay',()=>video.play().catch(()=>{}),{once:true});
  }
  async function approveAndNext(){const b=active();if(!b)return;b.status='approved';b.reviewerComment='';b.reviewerCommentTime=null;b.reviewedAt=new Date().toISOString();await persist();toast(`板块 ${index+1} 已通过`);if(index<state.blocks.length-1)loadBlock(index+1,true);else{loadBlock(index);renderQueue();}}
  async function requestChanges(){const text=comment.value.trim();if(!text){toast('请先填写修改意见');comment.focus();return;}const b=active();b.status='changes_requested';b.reviewerComment=text;b.reviewerCommentTime=commentAnchor;b.reviewedAt=new Date().toISOString();await persist();toast(`板块 ${index+1} 已保存 Comment`);if(index<state.blocks.length-1)loadBlock(index+1,true);else loadBlock(index);}
  function markComment(){video.pause();commentAnchor=video.currentTime;$('#commentTime').textContent=`片段内 ${fmt(commentAnchor)}`;comment.focus();}
  function toggle(){if(video.paused)video.play().catch(()=>{});else video.pause()}
  $('#queue').onclick=e=>{const item=e.target.closest('[data-index]');if(item)loadBlock(Number(item.dataset.index));};$('#playBtn').onclick=toggle;$('#restartBtn').onclick=()=>{video.currentTime=0;video.play().catch(()=>{})};$('#previousBtn').onclick=()=>loadBlock(index-1,true);$('#approveBtn').onclick=approveAndNext;$('#requestBtn').onclick=requestChanges;
  video.addEventListener('loadedmetadata',()=>{$('#duration').textContent=fmt(video.duration)});video.addEventListener('timeupdate',()=>{$('#now').textContent=fmt(video.currentTime)});video.addEventListener('play',()=>$('#playBtn').textContent='❚❚ 暂停');video.addEventListener('pause',()=>$('#playBtn').textContent='▶ 播放');video.addEventListener('ended',()=>{video.currentTime=0});
  window.addEventListener('keydown',e=>{const typing=e.target===comment;if(typing){if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();requestChanges()}if(e.key==='Escape'){e.preventDefault();comment.blur()}return;}if(e.repeat)return;if(['ArrowRight','ArrowLeft','Space','KeyM'].includes(e.code)){e.preventDefault();e.stopPropagation()}if(e.code==='ArrowRight')approveAndNext();if(e.code==='ArrowLeft')loadBlock(index-1,true);if(e.code==='Space')toggle();if(e.code==='KeyM')markComment();},true);
  fetch('/api/review-blocks').then(r=>r.json()).then(data=>{state=data;state.blocks=Array.isArray(state.blocks)?state.blocks:[];const firstPending=state.blocks.findIndex(b=>b.status!=='approved');loadBlock(firstPending>=0?firstPending:0);$('#saveState').textContent='已加载';}).catch(e=>{$('#saveState').textContent=`加载失败：${e.message}`});
})();
</script>
</body></html>
